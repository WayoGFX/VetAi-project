<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar ID por input</title>
</head>
<body>
    <h1>Seleccionar ID</h1>
    <form action="/showExp" method="post">
        <label for="VetKey">Ingresa el ID:</label>
        <input type="number" id="VetKey" name="VetKey" required>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
